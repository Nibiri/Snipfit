name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rustup reads crates/sim-core/rust-toolchain.toml and installs the pinned nightly.
      - name: Rust toolchain
        working-directory: crates/sim-core
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            crates/sim-core/target
          key: cargo-${{ hashFiles('crates/sim-core/Cargo.lock', 'crates/sim-core/rust-toolchain.toml') }}

      - run: npm ci
      - name: Rust unit tests
        working-directory: crates/sim-core
        run: cargo test --target x86_64-unknown-linux-gnu
      - run: npm run build:wasm
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (isolation + threaded WASM)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      # Deploys only when the Cloudflare secrets are set in the repo settings.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name=snipfit --branch=main
